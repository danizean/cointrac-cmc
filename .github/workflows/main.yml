name: Intelligence image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/intelligence/**"
      - "docs/CMC_CAPABILITY_MATRIX.json"
      - "docker-compose.vps.yml"
      - ".github/workflows/intelligence-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/intelligence/Dockerfile
          push: false
          tags: cointrac-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/intelligence/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/intelligence:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
