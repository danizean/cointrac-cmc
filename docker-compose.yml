services:
  intelligence:
    build:
      context: .
      dockerfile: apps/intelligence/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./.env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./docs/CMC_CAPABILITY_MATRIX.json:/app/docs/CMC_CAPABILITY_MATRIX.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MCP_PUBLIC_URL: ${NEXT_PUBLIC_MCP_PUBLIC_URL:-http://localhost:8000/mcp}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      intelligence:
        condition: service_healthy
    environment:
      INTELLIGENCE_API_URL: http://intelligence:8000
      NEXT_PUBLIC_MCP_PUBLIC_URL: ${NEXT_PUBLIC_MCP_PUBLIC_URL:-http://localhost:8000/mcp}
    restart: unless-stopped
